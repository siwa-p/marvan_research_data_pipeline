name: CI Pipeline
on:
  push:
    branches: [ feature/actions_ps ]
  pull_request:
    branches: [ feature/actions_ps ]
jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install quality tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Check code formatting
      run: |
        isort --check-only src/ tests/ airflow
        mypy src/ tests/ airflow
        black src/ tests/ airflow